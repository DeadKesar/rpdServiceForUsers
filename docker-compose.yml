services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rpdfos
      POSTGRES_PASSWORD: rpdfos
      POSTGRES_DB: rpdfos
    ports:
      - "5432:5432"   # если локальный порт занят — поменяй на "5433:5432" и в строке подключения
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpdfos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Конвертер DOCX -> PDF: Gotenberg (MIT) — LibreOffice в режиме headless за HTTP API (/forms/libreoffice/convert).
  # Образ ~2,5 ГБ; Times New Roman в нём нет — LibreOffice подставляет метрически совместимый Liberation Serif.
  converter:
    image: gotenberg/gotenberg:8.38.1
    ports:
      - "3000:3000"   # хост API ходит по адресу Converter:Url (по умолчанию http://localhost:3000)

volumes:
  dbdata:
