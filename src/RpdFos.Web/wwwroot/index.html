<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>АС создания РПД и ФОС</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Тема Radzen без базовых стилей страницы: оформление приложения остаётся на Bootstrap. -->
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/default-base.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RpdFos.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Произошла непредвиденная ошибка.
        <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss" title="Закрыть">🗙</span>
    </div>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script>
        // Переход к полю из списка замечаний и ошибок: первый найденный элемент — само поле или виджет, внутри которого оно.
        window.rpdfosScrollToField = (ids) => {
            for (const id of ids) {
                const el = document.getElementById(id);
                if (!el) continue;
                el.scrollIntoView({ behavior: "smooth", block: "center" });
                el.classList.add("field-flash");
                setTimeout(() => el.classList.remove("field-flash"), 1600);
                return;
            }
        };
        // Многострочные поля с высотой по содержимому (textarea.auto-grow). Браузер с field-sizing: content (CSS) делает
        // это сам; остальным — высота по прокрутке при вводе и при появлении поля на странице.
        if (!CSS.supports("field-sizing", "content")) {
            const grow = el => { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; };
            document.addEventListener("input", e => { if (e.target.matches?.("textarea.auto-grow")) grow(e.target); });
            new MutationObserver(records => {
                for (const r of records)
                    for (const n of r.addedNodes)
                        if (n.nodeType === 1) {
                            if (n.matches("textarea.auto-grow")) grow(n);
                            n.querySelectorAll("textarea.auto-grow").forEach(grow);
                        }
            }).observe(document.documentElement, { childList: true, subtree: true });
        }
        // Файл, полученный запросом с токеном: ссылка на него в памяти браузера — для предпросмотра и скачивания.
        window.rpdfosObjectUrl = (bytes, type) => URL.createObjectURL(new Blob([bytes], { type }));
        window.rpdfosRevokeUrl = (url) => URL.revokeObjectURL(url);
        window.rpdfosDownload = (bytes, name, type) => {
            const url = URL.createObjectURL(new Blob([bytes], { type }));
            const a = document.createElement("a");
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
